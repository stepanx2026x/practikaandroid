[package]
name = "sakura-yokai"
version = "2.0.0"
edition = "2021"
description = "Сакура и ёкаи — аниме-кликер для компьютера"
license = "MIT"
rust-version = "1.87"

[dependencies]
macroquad = { version = "0.4.16", default-features = false }
resvg = { version = "0.49", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# resvg очень медленный без оптимизаций — оптимизируем зависимости даже в отладочной сборке
[profile.dev.package."*"]
opt-level = 3
