name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: target/release/sakura-yokai.exe
            artifact: SakuraYokai-windows
          - os: ubuntu-latest
            file: target/release/sakura-yokai
            artifact: SakuraYokai-linux
          - os: macos-latest
            file: target/release/sakura-yokai
            artifact: SakuraYokai-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
